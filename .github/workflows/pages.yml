name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify committed official extracts
        run: python3 scripts/verify_data.py
      - name: Build static export
        run: npx next build
      - name: Keep Jekyll from hiding files
        run: touch out/.nojekyll
      - name: Publish Pages CNAME for getwethepeople.com
        run: |
          printf '%s\n' getwethepeople.com > out/CNAME
          test "$(tr -d '[:space:]' < out/CNAME)" = getwethepeople.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Configure Pages custom domain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Actions-published sites store the custom domain in Pages settings, not the artifact CNAME.
          # This token may lack "manage GitHub Pages settings"; continue-on-error so deploy still succeeds.
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f cname=getwethepeople.com \
            -f build_type=workflow
          gh api "repos/${GITHUB_REPOSITORY}/pages"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -F https_enforced=true \
            -f cname=getwethepeople.com \
            -f build_type=workflow || true
