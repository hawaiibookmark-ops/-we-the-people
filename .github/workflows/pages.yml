name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify committed official extracts
        run: python3 scripts/verify_data.py
      - name: Build static export
        run: npx next build
      - name: Keep Jekyll from hiding files
        run: touch out/.nojekyll
      - name: Refuse to publish a Pages CNAME until DNS is on GitHub
        run: |
          if [ -f out/CNAME ]; then
            echo "refusing to publish out/CNAME (github.io would 301 to the custom domain)" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Clear Pages custom domain until DNS is ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A published custom domain 301s github.io → getwethepeople.com. Porkbun is
          # still parking, so that redirect takes the public hub offline. Clear cname.
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" --input - <<'JSON'
          {"cname": null, "build_type": "workflow"}
          JSON
          gh api "repos/${GITHUB_REPOSITORY}/pages"
          test "$(gh api repos/${GITHUB_REPOSITORY}/pages --jq .cname)" = "null"
