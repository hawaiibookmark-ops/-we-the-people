name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify committed official extracts
        run: python3 scripts/verify_data.py
      - name: Prove dual-publish layout (no Next build)
        run: python3 scripts/test_prepare_pages_export.py
      - name: Build static export
        env:
          WTP_PAGES_EXPORT: "1"
        run: npx next build
      - name: Dual-publish apex / and /-we-the-people/
        run: python3 scripts/prepare_pages_export.py
      - name: Refuse to publish a Pages CNAME
        run: |
          # github.io 301s to the custom domain as soon as a CNAME/cname is set.
          # Apex / must already have index.html (proven above) before an admin Saves the domain.
          if [ -f out/CNAME ]; then
            echo "refusing to publish out/CNAME (github.io would 301 to the custom domain)" >&2
            exit 1
          fi
      - name: Record export layout proof
        run: |
          {
            echo "## Pages artifact layout"
            echo ""
            echo "Apex \`/\` (custom domain after Save) and github.io \`/-we-the-people/\` both need the hub."
            echo ""
            echo '```'
            ls -la out/index.html out/lookup/index.html out/-we-the-people/index.html
            echo ""
            test -d out/_next && echo "out/_next/ present"
            test -d out/-we-the-people/_next && echo "out/-we-the-people/_next/ present"
            test ! -f out/CNAME && echo "no out/CNAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm Pages custom domain stays cleared
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN cannot PUT Pages settings (403). Everything Claude / a repo
          # admin clears cname in Settings. This step only reports; it must not fail
          # the deploy after the artifact is already live.
          gh api "repos/${GITHUB_REPOSITORY}/pages"
          cname="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .cname)"
          echo "pages.cname=${cname}"
          if [ "${cname}" != "null" ] && [ -n "${cname}" ]; then
            echo "::warning::Pages cname is ${cname}; github.io will 301 until Settings → Pages custom domain is removed."
          fi
